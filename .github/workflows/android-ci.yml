name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee gradle-test.log; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Report test failures as annotations
        if: failure()
        shell: bash
        run: |
          # Surfaces the first build / test errors as annotations, readable via the GitHub API.
          grep -E "^e: |What went wrong|FAILED|Exception|Caused by|expected" gradle-test.log | head -40 | while IFS= read -r line; do echo "::error::${line//%/%25}"; done
          for f in app/build/test-results/testDebugUnitTest/*.xml; do grep -A3 "<failure" "$f" | head -8 | while IFS= read -r line; do echo "::error file=$(basename $f)::${line//%/%25}"; done; done

      - name: Set up app signing key
        env:
          KS_B64: ${{ secrets.AARUSH_KEYSTORE_B64 }}
        shell: bash
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/aarush.jks"
            echo "AARUSH_KEYSTORE_FILE=$RUNNER_TEMP/aarush.jks" >> "$GITHUB_ENV"
            echo "::notice::APK signed with the fixed Aarush key"
          else
            echo "::warning::AARUSH_KEYSTORE_B64 secret not set: APK uses a temporary key (Google sign-in won't work, updates need uninstall)"
          fi

      - name: Build debug APK
        env:
          AARUSH_KEYSTORE_PASSWORD: ${{ secrets.AARUSH_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Sends each build from main to the team's phones (Firebase App Distribution, group
      # "team"). Needs the FIREBASE_DISTRIBUTION_KEY secret (a service account key); without
      # it this step is skipped and the APK is only attached to the run as before.
      - name: Send to team phones (Firebase App Distribution)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DIST_KEY: ${{ secrets.FIREBASE_DISTRIBUTION_KEY }}
        shell: bash
        run: |
          if [ -z "$DIST_KEY" ]; then
            echo "::warning::FIREBASE_DISTRIBUTION_KEY secret not set: build not sent to phones"
            exit 0
          fi
          echo "$DIST_KEY" > "$RUNNER_TEMP/dist-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/dist-key.json"
          npm install -g firebase-tools@13 --silent
          NOTES="$(git log -1 --pretty=%s) (build ${GITHUB_RUN_NUMBER})"
          firebase appdistribution:distribute app/build/outputs/apk/debug/*.apk \
            --app 1:757629365751:android:44624fbc26d54db113d2f2 \
            --groups team \
            --release-notes "$NOTES"
          rm -f "$RUNNER_TEMP/dist-key.json"
          echo "::notice::Build ${GITHUB_RUN_NUMBER} sent to the team group"

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/