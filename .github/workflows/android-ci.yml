name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee gradle-test.log; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Report test failures as annotations
        if: failure()
        shell: bash
        run: |
          # Surfaces the first build / test errors as annotations, readable via the GitHub API.
          grep -E "^e: |What went wrong|FAILED|Exception|Caused by|expected" gradle-test.log | head -40 | while IFS= read -r line; do echo "::error::${line//%/%25}"; done
          for f in app/build/test-results/testDebugUnitTest/*.xml; do grep -A3 "<failure" "$f" | head -8 | while IFS= read -r line; do echo "::error file=$(basename $f)::${line//%/%25}"; done; done

      - name: Set up app signing key
        env:
          KS_B64: ${{ secrets.AARUSH_KEYSTORE_B64 }}
        shell: bash
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/aarush.jks"
            echo "AARUSH_KEYSTORE_FILE=$RUNNER_TEMP/aarush.jks" >> "$GITHUB_ENV"
            echo "::notice::APK signed with the fixed Aarush key"
          else
            echo "::warning::AARUSH_KEYSTORE_B64 secret not set: APK uses a temporary key (Google sign-in won't work, updates need uninstall)"
          fi

      - name: Build debug APK
        env:
          AARUSH_KEYSTORE_PASSWORD: ${{ secrets.AARUSH_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Publishes each build from main as a GitHub release ("build-<run number>") with the
      # APK attached. The app checks the latest release and offers a one-tap update.
      # Uses the workflow's own token: no secrets to set up.
      - name: Publish update for the app
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/AarushCPM.apk"
          gh release create "build-${GITHUB_RUN_NUMBER}" "$RUNNER_TEMP/AarushCPM.apk" \
            --title "Aarush CPM 1.2.${GITHUB_RUN_NUMBER}" \
            --notes "$(git log -1 --pretty=%s)" \
            --target "$GITHUB_SHA" --latest
          echo "::notice::Published update 1.2.${GITHUB_RUN_NUMBER}"

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/