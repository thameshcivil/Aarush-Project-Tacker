name: UI screenshots

# Renders review screenshots of redesigned screens (Paparazzi, JVM only, no emulator) and
# uploads them as an artifact. Run manually, or automatically on redesign-* branches.
on:
  workflow_dispatch:
  push:
    branches: [ "redesign-*" ]

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Record screenshots
        run: ./gradlew recordPaparazziDebug --stacktrace

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: app/src/test/snapshots/images/
